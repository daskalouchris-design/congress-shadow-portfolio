name: Check for new trades

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-trades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run check_trades.py
        env:
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUY_AMOUNT_EUR: ${{ vars.BUY_AMOUNT_EUR || '50' }}
        working-directory: scripts
        run: python check_trades.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Auto: check for new trades"
          git push
